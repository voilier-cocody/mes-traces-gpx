name: AIS position

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-position:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Récupérer la position AIS
        env:
          VESSELAPI_KEY: ${{ secrets.VESSELAPI_KEY }}
          MMSI: "227620210"
        run: node .github/scripts/ais.js

      - name: Commit si changement
        run: |
          git config user.name "ais-bot"
          git config user.email "actions@github.com"
          git add position.json
          git diff --cached --quiet && echo "Pas de changement" && exit 0
          git commit -m "Position AIS $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
